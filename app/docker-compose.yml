# Local dev stack. Ports bind to 127.0.0.1 only (loopback) — these services
# use weak dev credentials (masterKey / rustfsadmin) and must not be exposed to
# the LAN. The published ports let a web run on the host (`npm run dev`/`start`
# in app/web) reach the seeded stack:
#   MEILI_HOST=http://localhost:7700  MEILI_SEARCH_KEY=masterKey
#   NEXT_PUBLIC_IMAGE_BASE_URL=http://localhost:9000/images
# Note: these ports collide with the standalone test containers
# (revelio-testmeili:7700, revelio-tests3:9000) — stop those first.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: revelio
      POSTGRES_PASSWORD: revelio
      POSTGRES_DB: revelio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revelio"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    image: revelio-ingest:local
    build:
      context: .
      dockerfile: ingest/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://revelio:revelio@postgres:5432/revelio
      DATA_DIR: /data
      I18N_DIR: /i18n
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: masterKey
      ASSETS_DIR: /assets
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: images
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_REGION: eu-central-1
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - ../card-data/dist:/data:ro
      - ../card-data/i18n:/i18n:ro
      - ../card-data/assets:/assets:ro
    restart: "no"

  bot:
    image: revelio-bot:local
    build:
      context: .
      dockerfile: bot/Dockerfile
    # Not started by a bare `docker compose up`: it needs a real Discord token,
    # which most local work does not have. Start it with
    # `docker compose --profile bot up bot`.
    profiles: ["bot"]
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    # The bot owns its env, like web does. One file serves both a host run and
    # this container; `environment` below wins over it, so the localhost values
    # in .env.local stay correct for `npm run dev -w @revelio/bot`.
    env_file:
      - path: bot/.env.local
        required: false
    environment:
      DATABASE_URL: postgres://revelio:revelio@postgres:5432/revelio
      MEILI_HOST: http://meilisearch:7700
      MEILI_SEARCH_KEY: masterKey
      # Discord fetches embed images from this one, so localhost is as good as
      # anything here: it is unreachable from Discord either way in local dev.
      IMAGE_BASE_URL: http://localhost:9000/images
      # The /deck renderer fetches in-process, from inside this container, where
      # localhost is the container itself. rustfs is the service name, the same
      # way DATABASE_URL and MEILI_HOST above use theirs.
      IMAGE_FETCH_BASE_URL: http://rustfs:9000/images
      SITE_BASE_URL: http://localhost:3000
    # No restart policy: this is the local dev stack, and bot/.env.local is
    # optional, so `unless-stopped` would crash-loop on a fresh clone instead
    # of showing the env error once. Matches ingest/migrate.
    restart: "no"

  migrate:
    image: revelio-ingest:local
    build:
      context: .
      dockerfile: ingest/Dockerfile
    profiles: ["tools"]          # not started by `up`; run via `docker compose run --rm migrate`
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://revelio:revelio@postgres:5432/revelio
    command: ["node", "migrate.mjs"]
    restart: "no"

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    # Replaces MinIO, whose community edition is archived (GitHub repo archived
    # 2026-04-24) and whose Docker Hub namespace was withdrawn. RustFS speaks the
    # same S3 API on the same ports, including the public-read bucket policy the
    # card images rely on. Pinned like postgres and meilisearch are.
    image: rustfs/rustfs:1.0.0-rc.6
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      # The deck PNG export reads the canvas back with toBlob(), which needs the
      # card images fetched with CORS - without this header every card in the
      # exported sheet is a name-only placeholder. Unset is the whole reason the
      # export looks broken on a fresh local stack.
      #
      # "*" rather than the dev origin: the app is reached on several (localhost
      # and 127.0.0.1, port 3000 for dev and 3100 for the e2e run). The images
      # are public-read anyway - see the bucket policy in
      # ingest/src/upload-images.ts. RustFS sends the header only when a request
      # carries an Origin, and a plain <img> on a card page sends none - which
      # is why the export reads past the HTTP cache rather than reusing what
      # that page left in it (see web/src/lib/deck-png.ts).
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # console, at /rustfs/console/ (bare / answers S3)
    volumes:
      - rustfs:/data
    healthcheck:
      # Not /minio/health/live or /health: both answer 200 while the server still
      # reports "waiting for storage_quorum" on /. A ready S3 handler answers an
      # unsigned GET / with AccessDenied, so that is what we look for.
      test: ["CMD-SHELL", "curl -s http://localhost:9000/ | grep -q AccessDenied"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI → http://localhost:8025

volumes:
  pgdata: {}
  meili: {}
  rustfs: {}
